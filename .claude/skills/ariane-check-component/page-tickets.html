<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITRE__</title>
<!-- Modèle de la page de tickets du contrôle. page-tickets.sh le remplit avec la sortie du
     contrôle (le fichier .md du même nom) ; la page la découpe elle-même, un ticket par composant.
     Ne pas retoucher une page produite : refaire le .md, puis relancer le script. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root{--bg:#fafaf9;--card:#fff;--fg:#1c1c1a;--mut:#6b6b66;--line:#e5e4e0;--acc:#2f5bd3;--ok:#2e7d4f;--okbg:#e6f3eb;--warn:#a5530c;--warnbg:#fbefe0}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--fg:#ecebe7;--mut:#9a9993;--line:#34332f;--acc:#7c9bff;--ok:#6fcf97;--okbg:#1b3324;--warn:#f0a95b;--warnbg:#3a2814}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:24px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 20px}
.barre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.barre button{background:transparent;color:var(--fg);border:1px solid var(--line)}
.barre button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
nav a{color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:24px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}
header h2{margin:0;font-size:20px;overflow-wrap:anywhere}
.verdict{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.verdict.ok{background:var(--okbg);color:var(--ok)}.verdict.reprendre{background:var(--warnbg);color:var(--warn)}
.droite{display:flex;align-items:center;gap:10px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
button.fait{background:var(--ok)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.md h3{font-size:16px;margin:20px 0 6px}.md p{margin:8px 0}.md ul,.md ol{padding-left:22px}
.md code{font-size:13px;background:rgba(127,127,127,.15);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.md pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
details.notes{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;color:var(--mut);font-size:14px}
details.notes summary{cursor:pointer}
.libre{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1 id="titre"></h1>
<p class="sub" id="sub"></p>
<div class="barre" role="group" aria-label="Filtrer les tickets">
  <button type="button" data-f="tous" class="on">Tous</button>
  <button type="button" data-f="reprendre">À reprendre</button>
  <button type="button" data-f="ok">Bien construits</button>
</div>
<nav id="nav"></nav>
<div id="list"></div>
</main>
<script type="text/plain" id="sortie">
<!--SORTIE-->
</script>
<script>
const brut=document.getElementById('sortie').textContent.replace(/^\n|\n$/g,'');
const rendu=s=>window.marked?marked.parse(s):'<pre>'+s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>';
const titre=document.title,m=titre.match(/^(\d{4})-(\d\d)-(\d\d)-(.*)$/);
document.getElementById('titre').textContent=m?'Tickets — '+m[4].replace(/^controle-?/,'').replace(/-/g,' ')+' — '+m[3]+'/'+m[2]+'/'+m[1]:titre;
// Découpe : ce qui précède le premier « ## » est l'en-tête ; chaque « ## » ouvre un composant ;
// les notes « Pour les passes d'Ariane » restent hors du bloc à copier.
const lignes=brut.split('\n'),blocs=[];let tete=[],cur=null;
for(const l of lignes){if(/^## /.test(l)){cur={nom:l.slice(3).trim(),l:[]};blocs.push(cur)}else if(cur)cur.l.push(l);else tete.push(l)}
const sub=tete.join('\n').trim();
document.getElementById('sub').innerHTML=sub?rendu(sub).replace(/^<p>|<\/p>\s*$/g,''):'';
const nav=document.getElementById('nav'),list=document.getElementById('list');
blocs.forEach((b,i)=>{
  const corps=b.l.join('\n').replace(/\n+---\s*$/,'');
  const k=corps.search(/^\*Pour les passes d'Ariane/m);
  const ticket=(k<0?corps:corps.slice(0,k)).trim(),notes=k<0?'':corps.slice(k).trim();
  const vl=(ticket.match(/^\*\*([✅⚠️].*?)\*\*\s*$/m)||[])[1]||'';
  const v=vl.startsWith('✅')?'ok':vl.startsWith('⚠')?'reprendre':'';
  const s=document.createElement('section');s.id='c'+i;s.dataset.v=v;
  const a=document.createElement('a');a.href='#c'+i;a.textContent=b.nom;a.dataset.v=v;nav.appendChild(a);
  const h=document.createElement('header'),t=document.createElement('h2');t.textContent=b.nom;
  const d=document.createElement('div');d.className='droite';
  if(v){const p=document.createElement('span');p.className='verdict '+v;p.textContent=v==='ok'?'Bien construit':'À reprendre';d.appendChild(p)}
  const md=document.createElement('div');md.className='md';md.innerHTML=rendu(ticket);
  const bt=document.createElement('button');bt.type='button';bt.textContent='Copier le ticket';
  bt.onclick=async()=>{
    const texte='## '+b.nom+'\n'+ticket,html='<h2>'+t.innerHTML+'</h2>'+md.innerHTML;
    const fini=ok=>{bt.textContent=ok?'Copié':'Sélectionne le texte';bt.classList.toggle('fait',ok);setTimeout(()=>{bt.textContent='Copier le ticket';bt.classList.remove('fait')},1600)};
    try{
      if(window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([texte],{type:'text/plain'})})]);
      else await navigator.clipboard.writeText(texte);
      fini(true);
    }catch(e){
      const r=document.createRange();r.selectNodeContents(md);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      let ok=false;try{ok=document.execCommand('copy')}catch(_){}
      fini(ok);
    }
  };
  d.appendChild(bt);h.append(t,d);s.append(h,md);
  if(notes){const n=document.createElement('details');n.className='notes';n.innerHTML='<summary>Notes pour les étapes suivantes d’Ariane (hors ticket)</summary>'+rendu(notes);s.appendChild(n)}
  list.appendChild(s);
});
if(!blocs.length)list.innerHTML='<section class="md">'+rendu(brut)+'</section>';
document.querySelectorAll('.barre button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.barre button').forEach(x=>x.classList.toggle('on',x===b));
  const f=b.dataset.f;document.querySelectorAll('section,#nav a').forEach(e=>{e.hidden=!(f==='tous'||e.dataset.v===f)})});
</script>
</body>
</html>
